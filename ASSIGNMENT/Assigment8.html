<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hyperlinks and Images</title>
</head>
<body>
    <h3 id="top">Links demo</h3>

    <a href="https://www.google.com" target="_blank" rel="noopener">External link</a><br>
    <a href="#bottom">Jump to bottom</a><br>
    <a href="mailto:admin@example.com">Email us</a><br>

    <p>Logo</p>
    <a href="https://www.example.com" target="_blank" rel="noopener">
        <img src="https://placehold.co/100x70?text=Logo"
             alt="College logo" width="100" height="70">
    </a>

    <div style="height: 350px;"></div>

    <p id="bottom">Bottom. <a href="#top">Back to top</a></p>
</body>
</html>
