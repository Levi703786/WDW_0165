<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weekly Timetable</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <table>
        <caption>Weekly Timetable</caption>
        <thead>
            <tr>
                <th>Day</th><th>9-10</th><th>10-11</th><th>11-12</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>Mon</th><td>Maths</td><td>HTML</td>
                <td rowspan="2">Web Lab</td>
            </tr>
            <tr>
                <th>Tue</th><td>DBMS</td><td>OS</td>
            </tr>
            <tr>
                <th>Wed</th><td colspan="3">Seminar</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
