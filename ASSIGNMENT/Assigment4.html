<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Semantic and Non-Semantic Elements</title>
</head>
<body>
    <!-- Semantic layout -->
    <header>
        <h1>College Portal</h1>
        <nav>
            <a href="#home">Home</a> |
            <a href="#courses">Courses</a>
        </nav>
    </header>

    <main id="home">
        <section id="courses">
            <h2>Admission Open</h2>
            <p>Apply before 30 June.</p>
        </section>
    </main>

    <footer>
        <p>Notice: Library closed Sunday.</p>
        <p>&copy; 2026 College</p>
    </footer>

    <!-- Non-semantic layout example:
    <div class="header">Header content</div>
    <div class="main">Main content</div>
    <div class="footer">Footer content</div>
    -->
</body>
</html>
